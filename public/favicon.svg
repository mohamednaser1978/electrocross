<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Zap Gradient -->
    <linearGradient id="zapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Filter for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Electronic Microchip Circuit Traces -->
  <path d="M10 32h7 M47 32h7 M32 10v7 M32 47v7" stroke="#334155" stroke-width="2" stroke-linecap="round" />
  <circle cx="17" cy="32" r="1.5" fill="#06b6d4" opacity="0.8" />
  <circle cx="47" cy="32" r="1.5" fill="#06b6d4" opacity="0.8" />
  <circle cx="32" cy="17" r="1.5" fill="#06b6d4" opacity="0.8" />
  <circle cx="32" cy="47" r="1.5" fill="#06b6d4" opacity="0.8" />

  <!-- Electric Lightning Zap Symbol -->
  <polygon points="36,15 21,35 32,35 28,49 44,29 33,29" fill="url(#zapGrad)" filter="url(#glow)" />

  <!-- Emerald Live Indicator Dot -->
  <circle cx="50" cy="50" r="4.5" fill="#10b981" stroke="#020617" stroke-width="1.5" />
</svg>
